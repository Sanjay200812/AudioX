services:
  audiox-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audiox
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - AUDIOX_PASSWORD=${AUDIOX_PASSWORD:-}
      - TEMP_DIR=/tmp/audiox
      - FILE_EXPIRY_MINUTES=30
      - MAX_FILE_SIZE_MB=500
      - QUEUE_CONCURRENCY=1
    volumes:
      - audiox-temp:/tmp/audiox

volumes:
  audiox-temp:
    driver: local
